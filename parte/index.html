<style>
/* Parte diario: columna de lectura con tres niveles (30 s, 3 min, a fondo). Tarjetas de dato con barra de percentil frente a su propio historial. Ambientación oscura única, a juego con la web nueva. */
:root{
  --bg:#08080b; --panel:#0f1014; --panel2:#14161b; --line:#23252c; --fg:#f2efe9; --mute:#9095a0; --dim:#5d626c;
  --red:#ff4757; --cyan:#4fd8e8; --amber:#f2b441; --ok:#5be38c;
  --f-d:"Space Grotesk","Helvetica Neue",Arial,sans-serif; --f-b:Inter,"Helvetica Neue",Arial,sans-serif; --f-m:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-b);font-size:16px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:40px}
a{color:var(--cyan)}
.mono{font-family:var(--f-m);letter-spacing:.04em}
/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(8,8,11,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:700;letter-spacing:.14em;margin-right:auto}
.brand img{width:24px;height:24px}
.nav{display:flex;gap:6px}
.nav a{font:600 11px/1 var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);text-decoration:none;padding:8px 10px;border:1px solid var(--line)}
.nav a:hover,.nav a:focus-visible{border-color:var(--red);outline:none}
.chip{font:600 10.5px/1 var(--f-m);letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border:1px solid #5a1820;color:var(--red)}
/* portada del parte */
.hero{display:grid;gap:14px;padding-top:28px}
.eyebrow{font:600 11px/1 var(--f-m);letter-spacing:.14em;color:var(--red);text-transform:uppercase}
h1{font-family:var(--f-d);font-weight:700;font-size:clamp(34px,6vw,64px);line-height:1;margin:0;letter-spacing:-.015em;text-wrap:balance}
h1 em{font-style:normal;color:var(--red)}
.meta{font-family:var(--f-m);font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 18px}
h2{font-family:var(--f-d);font-weight:700;font-size:26px;margin:0;display:flex;align-items:baseline;gap:12px;text-wrap:balance}
h2 small{font:500 11px/1 var(--f-m);color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
section{display:grid;gap:16px;scroll-margin-top:72px}
/* 30 segundos */
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.key{background:var(--panel);border:1px solid var(--line);padding:18px;display:grid;gap:10px;align-content:start;min-width:0;position:relative}
.key .n{font:700 12px/1 var(--f-m);color:var(--red)}
.key h3{font-family:var(--f-d);font-size:21px;line-height:1.15;margin:0;text-wrap:balance}
.key .big{font-family:var(--f-d);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.key .big small{font:500 13px var(--f-m);color:var(--mute)}
.key p{margin:0;color:var(--mute);font-size:14.5px}
.tag{font:600 10.5px/1 var(--f-m);letter-spacing:.06em;padding:4px 6px;border:1px solid currentColor;justify-self:start;text-transform:uppercase}
.tag.neg{color:var(--red)}.tag.pos{color:var(--ok)}.tag.neu{color:var(--amber)}
/* regla */
.rule{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;border:1px solid var(--line);background:linear-gradient(135deg,#130c10,var(--panel) 55%);padding:22px}
.rule .state{font-family:var(--f-d);font-weight:700;font-size:28px;line-height:1.1}
.rule .state b{color:var(--red)}
.rule p{margin:8px 0 0;color:var(--mute)}
.gauge{display:grid;gap:8px;align-content:center}
.gbar{position:relative;height:18px;background:#191b21;border:1px solid var(--line)}
.gbar .fill{position:absolute;inset:0 auto 0 0;background:var(--red)}
.gbar .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--fg)}
.gbar .mk.x{background:var(--mute)}
.glab{display:flex;justify-content:space-between;font:500 11px var(--f-m);color:var(--mute)}
.lvl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:6px}
.lvl div{background:var(--panel);padding:10px 12px;min-width:0}
.lvl b{display:block;font-family:var(--f-d);font-size:20px;font-variant-numeric:tabular-nums}
.lvl span{font:500 10.5px var(--f-m);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
/* 3 minutos */
.block{display:grid;gap:10px}
.block h3{font:600 12px/1 var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin:6px 0 0}
.block .prose{margin:0;max-width:72ch;color:#d6d3cd}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);padding:14px 14px 12px;display:grid;gap:8px;min-width:0}
.card .lb{font-size:13px;color:var(--mute);line-height:1.35}
.card .v{font-family:var(--f-d);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.card .v small{font:500 11.5px var(--f-m);color:var(--mute);margin-left:4px}
.card .ch{font:600 12px var(--f-m)}
.card .ch.neg{color:var(--red)}.card .ch.pos{color:var(--ok)}.card .ch.neu{color:var(--mute)}
.pct{display:grid;gap:4px}
.pct .bar{position:relative;height:6px;background:linear-gradient(90deg,#1f2a33,#2a2d36 50%,#33232a)}
.pct .bar i{position:absolute;top:-4px;width:3px;height:14px;background:var(--fg)}
.pct .pl{display:flex;justify-content:space-between;font:500 10px var(--f-m);color:var(--dim)}
.card .src{font:500 10.5px var(--f-m);color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.card .src a{color:var(--dim)}
.card.na{border-style:dashed;opacity:.75}
.card.flag{border-color:#4a2a1a;box-shadow:inset 3px 0 0 var(--amber)}
details.more{border-top:1px solid var(--line);padding-top:6px}
details.more summary{cursor:pointer;font:500 11px var(--f-m);color:var(--mute);letter-spacing:.04em}
details.more p{margin:6px 0 0;font-size:13px;color:var(--mute)}
/* vigilar y fuentes */
.watch{display:grid;gap:10px;counter-reset:w}
.watch li{list-style:none;border:1px solid var(--line);padding:14px 16px 14px 52px;position:relative;background:var(--panel)}
.watch li::before{counter-increment:w;content:counter(w,decimal-leading-zero);position:absolute;left:16px;top:14px;font:700 13px var(--f-m);color:var(--amber)}
.watch ul{padding:0;margin:0;display:grid;gap:10px}
.srcs{width:100%;border-collapse:collapse;font-size:13.5px}
.srcs th,.srcs td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.srcs th{font:600 10.5px var(--f-m);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.srcs td.d{font-family:var(--f-m);font-size:12px;color:var(--mute);white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--line)}
span[lang]{display:contents}
.lvl b span{font:inherit;color:inherit;text-transform:none;letter-spacing:inherit}
html[data-lang="en"] [lang="es"],html:not([data-lang="en"]) [lang="en"]{display:none!important}
.lang{display:flex;border:1px solid var(--line)}
.lang button{font:600 11px/1 var(--f-m);letter-spacing:.08em;padding:7px 9px;background:none;color:var(--mute);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.lang button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.disc{font-size:13px;color:var(--dim);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:820px){.three{grid-template-columns:minmax(0,1fr)}.rule{grid-template-columns:minmax(0,1fr)}.nav{display:none}}
@media (max-width:420px){.lvl{grid-template-columns:minmax(0,1fr)}}
.daysel select{font:600 11px var(--f-m);background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:6px 8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

  cftc_lev:{g:"c-pos",lb:["Fondos apalancados · futuros BTC CME (neto)","Leveraged funds · CME BTC futures (net)"],v:f=>[f.value,0],u:["contratos","contracts"],ch:f=>[f.change_1w,0,["en la semana","on the week"]],p:"percentile_26w",pl:["26 semanas","26 weeks"],src:"CFTC · Traders in Financial Futures",url:"https://www.cftc.gov/MarketReports/CommitmentsofTraders/index.htm",m:["Suelen ser fondos que arbitran la base: un neto corto no es necesariamente una apuesta bajista.","Usually basis-trading funds: a net short is not necessarily a bearish bet."]},

const ERRMAP = {fed_balance:["fed_balance","net_liquidity"], polymarket:["polymarket"], tga:["tga","net_liquidity"], rrp:["rrp","net_liquidity"], cftc:["cftc_lev","cftc_am"], funding:["funding"], open_interest:["open_interest"], dvol:["dvol"], coinbase_premium:["coinbase_premium"], stablecoins:["stablecoins"], mempool:["btc_fees"]};
let LANG = "es", P = null, D = null;
const n = (x, d, l = LANG) => x == null ? "—" : Number(x).toLocaleString(T[l].locale, {minimumFractionDigits:d, maximumFractionDigits:d});
const sgn = x => (x > 0 ? "+" : x < 0 ? "−" : "") ;
const nn = (x, d) => sgn(x) + n(Math.abs(x), d);
const pick = (v, i = LANG === "es" ? 0 : 1) => Array.isArray(v) ? v[i] : v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<em>$1</em>");
const fdate = (s, l = LANG) => { if (!s) return "—"; const [d, t] = s.split(" "); const dt = new Date(d + "T12:00:00Z");
  const txt = dt.toLocaleDateString(T[l].locale, {day:"numeric", month:"short"}); return t ? txt + " " + t : txt; };
const fact = id => D.facts.find(f => f.id === id);

function cardHTML(id){
  const c = CARDS[id], f = fact(id), lb = pick(c.lb), src = pick(c.src), t = T[LANG];
  const foot = `<div class="src"><a href="${c.url}" target="_blank" rel="noopener">${esc(src)}</a><span>${f ? fdate(f.asof) : "—"}</span></div>`;
  if (!f) return `<article class="card na"><div class="lb">${esc(lb)}</div><div class="v" style="font-size:18px;color:var(--mute)">${t.na}</div><details class="more"><summary>${t.what}</summary><p>${esc(pick(c.m))}</p></details>${foot}</article>`;
  if (c.list) return `<article class="card"><div class="lb">${esc(lb)}</div>${(f.value||[]).slice(0,4).map(x=>`<div class="ch neu" style="color:var(--fg)">${esc(x.market)} · <b>${esc(x.odds)}</b></div>`).join("")}<details class="more"><summary>${t.what}</summary><p>${esc(pick(c.m))}</p></details>${foot}</article>`;
  const [val, dec, suf] = c.v(f); let ch = "", cls = "neu";
  const cc = c.ch && c.ch(f);
  if (cc) { if (cc[4]) { ch = `${n(cc[4].coinbase,2)} / ${n(cc[4].binance,2)}`; cls = val < 0 ? "neg" : "pos"; }
    else if (cc[3]) { ch = cc[3].replace("-", "−").replace(".", LANG === "es" ? "," : "."); cls = "neg"; }
    else { ch = `${nn(cc[0], cc[1])}${pick(cc[2]).startsWith("%") ? "" : " "}${pick(cc[2])}`; cls = cc[0] < 0 ? "neg" : cc[0] > 0 ? "pos" : "neu"; } }
  const pv = c.p && f[c.p] != null ? f[c.p] : null;
  const pct = pv == null ? "" : `<div class="pct"><div class="bar"><i style="left:calc(${pv}% - 1.5px)"></i></div><div class="pl"><span>${t.min}</span><span>${t.pct} ${n(pv,1)} · ${pick(c.pl)}</span><span>${t.max}</span></div></div>`;
  const flag = D.unusual.some(u => u.id === id);
  const valTxt = (val < 0 ? "−" : "") + n(Math.abs(val), dec) + (suf ? (LANG === "es" ? " " : "") + suf : "");
  const m = typeof c.m === "function" ? pick(c.m(f)) : pick(c.m);
  return `<article class="card${flag?" flag":""}"><div class="lb">${esc(lb)}</div><div class="v">${valTxt}<small>${pick(c.u)}</small></div>${ch?`<div class="ch ${cls}">${ch}</div>`:""}${pct}
    <details class="more"><summary>${t.what}</summary><p>${esc(m)}</p></details>${foot}</article>`;
}

function keyHTML(k, i){
  const f = fact(k.fact), u = D.unusual.find(x => x.id === k.fact), t = T[LANG]; let big = "", unit = "", tag = "";
  if (f) { const c = CARDS[k.fact]; const cc = c && c.ch && c.ch(f);
    if (k.fact === "funding") { big = nn(f.annualized_pct, 1) + (LANG==="es"?" %":"%"); unit = pick(c.u); }
    else if (cc && cc[0] != null) { big = nn(cc[0], cc[1]) + (pick(cc[2]).startsWith("%") ? (LANG==="es"?" %":"%") : ""); unit = pick(cc[2]).replace(/^%\s*/, ""); if (!pick(cc[2]).startsWith("%")) unit = pick(c.u) + " " + unit; }
    else { const [v, d, s] = c.v(f); big = nn(v, d) + (s || ""); unit = pick(c.u); } }
  if (u) tag = u.z != null ? `${t.unusualZ} ${nn(u.z,2)}` : t.pctTag(n(u.percentile,0));
  return `<article class="key"><span class="n">0${i+1}</span>${tag?`<span class="tag neg">${tag}</span>`:""}<h3>${esc(k.title)}</h3>${big?`<div class="big">${big} <small>${esc(unit)}</small></div>`:""}<p>${esc(k.text)}</p></article>`;
}

function render(){
  const t = T[LANG], L = P[LANG];
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t[e.dataset.t]);
  document.getElementById("bES").setAttribute("aria-pressed", LANG === "es"); document.getElementById("bEN").setAttribute("aria-pressed", LANG === "en");
  const longDate = new Date(P.date + "T12:00:00Z").toLocaleDateString(t.locale, {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  document.getElementById("eyebrow").textContent = t.eyebrow(longDate);
  document.getElementById("headline").innerHTML = md(L.headline);
  document.title = (LANG === "es" ? "Parte ATLAS · " : "ATLAS Daily Brief · ") + P.date;
  const px = fact("btc_price"), [ok, tot] = D.sources_ok.split("/");
  document.getElementById("meta").innerHTML = (px ? `<span>BTC ${LANG==="es" ? n(px.value,0)+" $" : "$"+n(px.value,0)} · ${nn(px.change_1d_pct,1)}${LANG==="es"?" %":"%"} ${LANG==="es"?"en el día":"on the day"} · ${nn(px.change_7d_pct,1)}${LANG==="es"?" %":"%"} ${LANG==="es"?"en 7 días":"in 7 days"}</span>` : "") + `<span>${t.sources(ok, tot)}</span><span>${t.checked}</span>`;
  document.getElementById("keys").innerHTML = L.keys.map(keyHTML).join("");
  const r = fact("atlas_rule");
  if (r) { const [v, of] = r.value.split("/").map(Number);
    document.getElementById("ruleState").innerHTML = `${r.in_market ? t.in : t.out}: <b>${v} ${LANG==="es"?"de":"of"} ${of}</b> ${t.rulesLong}`;
    const fam = r.families || {}; const famTxt = LANG === "es" ? `Por familias: medias ${fam.media?.long} de ${fam.media?.total}, momentum ${fam.momentum?.long} de ${fam.momentum?.total} y canales ${fam.canal?.long} de ${fam.canal?.total}. ` : `By family: moving averages ${fam.media?.long} of ${fam.media?.total}, momentum ${fam.momentum?.long} of ${fam.momentum?.total} and channels ${fam.canal?.long} of ${fam.canal?.total}. `;
    document.getElementById("ruleText").textContent = `(${r.votes_last5.join(", ")}) ` + famTxt + (L.blocks.rule || "");
    document.getElementById("gfill").style.width = (v / of * 100) + "%"; document.getElementById("gbar").setAttribute("aria-label", `${v}/${of}`);
    const lvl = r.in_market ? r.exit_level : r.entry_level, dist = r.in_market ? r.exit_distance_pct : r.entry_distance_pct;
    document.getElementById("lvl").innerHTML = `<div><b>${n(px ? px.value : 0, 0)}</b><span>${t.close} ${fdate(r.asof)}</span></div><div><b>${n(lvl,1)}</b><span>${r.in_market ? t.exitBelow : t.enterAbove}</span></div><div><b>${nn(dist,2)}${LANG==="es"?" %":"%"}</b><span>${t.dist}</span></div>`; }
  ["liquidity","positioning","sentiment"].forEach(b => document.getElementById("b-" + b).textContent = L.blocks[b] || "");
  ["c-liq","c-pos","c-sen"].forEach(g => document.getElementById(g).innerHTML = "");
  const failed = new Set(Object.keys(D.errors || {}).flatMap(k => ERRMAP[k] || [k]));
  Object.keys(CARDS).forEach(id => { if (fact(id) || failed.has(id)) document.getElementById(CARDS[id].g).insertAdjacentHTML("beforeend", cardHTML(id)); });
  document.getElementById("watch").innerHTML = L.watch.map(w => `<li>${md(w)}</li>`).join("");
  document.getElementById("srcs").innerHTML = Object.keys(CARDS).filter(id => fact(id) || failed.has(id)).map(id => { const c = CARDS[id], f = fact(id);
    return `<tr><td>${esc(pick(c.lb))}</td><td><a href="${c.url}" target="_blank" rel="noopener">${esc(pick(c.src))}</a></td><td class="d">${f ? fdate(f.asof) : t.naShort}</td></tr>`; }).join("")
    + (r ? `<tr><td>${t.ruleRow}</td><td><a href="https://data-api.binance.vision" target="_blank" rel="noopener">${t.own}</a></td><td class="d">${fdate(r.asof)}</td></tr>` : "");
}

async function load(day){
  const base = day ? `archivo/${day}/` : "";
  try { const [p, d] = await Promise.all([fetch(base + "parte.json", {cache:"no-store"}), fetch(base + "datos.json", {cache:"no-store"})]);
    if (!p.ok || !d.ok) throw 0; P = await p.json(); D = await d.json(); }
  catch (e) { P = window.PARTE_EMBED; D = window.DATOS_EMBED; }   // vista previa sin servidor
  render();
}
async function init(){
  let days = [];
  try { const r = await fetch("index.json", {cache:"no-store"}); if (r.ok) days = (await r.json()).days || []; } catch (e) {}
  const q = new URLSearchParams(location.search).get("d");
  const sel = document.getElementById("day");
  sel.innerHTML = (days.length ? days : [window.PARTE_EMBED?.date].filter(Boolean)).slice().reverse().map(d => `<option value="${d}">${d}</option>`).join("");
  if (q) sel.value = q;
  sel.onchange = () => { const d = sel.value, latest = days[days.length - 1]; history.replaceState(null, "", d === latest ? location.pathname : "?d=" + d); load(d === latest ? null : d); };
  let l = "en";
  try { l = localStorage.getItem("atlas-lang") || l; } catch (e) {}
  if (location.hash === "#en" || location.hash === "#es") l = location.hash.slice(1);
  LANG = l;
  function updateLinks(){
    document.documentElement.lang = LANG;
    const query = LANG === "es" ? "?lang=es" : "";
    document.getElementById("evidence-link").href = "../office/evidence.html"+query;
    const rule = document.getElementById("rule-link");
    rule.href = "../office/simulation.html"+query;
    rule.textContent = LANG === "es" ? "Nuestra regla" : "Our rule";
  }
  updateLinks();
  const setLang = x => { LANG = x; updateLinks(); try { localStorage.setItem("atlas-lang", x); } catch (e) {} if (P) render(); };
  document.getElementById("bES").onclick = () => setLang("es"); document.getElementById("bEN").onclick = () => setLang("en");
  await load(q && q !== days[days.length - 1] ? q : null);
}
init();
</script>
